[env:cardputer-adv]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
; Direct USB upload by default. To flash through a ser2net/RFC2217 bridge instead:
;   pio run -t upload --upload-port rfc2217://<host>:4001
; usb_reset is required there because RFC2217 does not forward DTR/RTS.
upload_flags = --before=usb_reset
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    m5stack/M5Cardputer @ ^1.1.0
    tzapu/WiFiManager @ ^2.0.17
    knolleary/PubSubClient @ ^2.8

